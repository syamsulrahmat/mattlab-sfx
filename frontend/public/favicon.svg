<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="zapFaviconGrad" x1="8" y1="4" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="0.45" stop-color="#818cf8" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark slate squircle background so it pops on both light and dark browser chrome -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="#0b0f19" stroke="#312e81" stroke-width="1" />

  <!-- Pure Electric Zap Mark -->
  <path
    d="M17.5 4L5.5 17.5H16.5L14.5 28L26.5 13.5H16.5L17.5 4Z"
    fill="url(#zapFaviconGrad)"
    stroke="#818cf8"
    stroke-width="1.2"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#tabGlow)"
  />
</svg>
