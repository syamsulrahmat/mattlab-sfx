<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.6" />
    </linearGradient>

    <!-- Sonic Waveform Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Center Spark Gradient -->
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Ambient Center Flare -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGlow)" stroke="url(#borderGlow)" stroke-width="2.5" />

  <!-- Center Ambient Light -->
  <circle cx="64" cy="64" r="42" fill="url(#centerGlow)" />

  <!-- Audio Waveform Bars (Symmetric Equalizer Spectrum) -->
  <g filter="url(#neonGlow)">
    <!-- Bar 1 (Outer Left) -->
    <rect x="20" y="52" width="6.5" height="24" rx="3.25" fill="url(#waveGradient)" opacity="0.65" />
    <!-- Bar 2 -->
    <rect x="32" y="40" width="6.5" height="48" rx="3.25" fill="url(#waveGradient)" opacity="0.8" />
    <!-- Bar 3 (Inner Left) -->
    <rect x="44" y="28" width="6.5" height="72" rx="3.25" fill="url(#waveGradient)" opacity="0.95" />
    <!-- Bar 4 (Center Peak / Sonic Spark) -->
    <rect x="56" y="16" width="6.5" height="96" rx="3.25" fill="url(#waveGradient)" />
    <!-- Center Accent Bolt / Frequency Core -->
    <rect x="66" y="24" width="6.5" height="80" rx="3.25" fill="url(#waveGradient)" />
    <!-- Bar 6 (Inner Right) -->
    <rect x="78" y="34" width="6.5" height="60" rx="3.25" fill="url(#waveGradient)" opacity="0.95" />
    <!-- Bar 7 -->
    <rect x="90" y="44" width="6.5" height="40" rx="3.25" fill="url(#waveGradient)" opacity="0.8" />
    <!-- Bar 8 (Outer Right) -->
    <rect x="102" y="54" width="6.5" height="20" rx="3.25" fill="url(#waveGradient)" opacity="0.65" />
  </g>

  <!-- Dynamic Sonic Impulse Accent Wave -->
  <path d="M 18 64 Q 38 64 48 50 T 64 36 T 80 78 T 110 64" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#neonGlow)" />
</svg>
